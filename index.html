<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>World Clock</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>World Clock⌛</h1>
      </header>

      <main>
        <label for="cities">Select a city🏙️</label>
        <select id="cities" name="city">
          <option value="johannesburg">Johannesburg 🇿🇦</option>
          <option value="lagos">Lagos 🇳🇬</option>
          <option value="tokyo">Tokyo 🇯🇵</option>
          <option value="london">London 🇬🇧</option>
          <option value="dubai">Dubai 🇦🇪</option>
          <option value="berlin">Berlin 🇩🇪</option>
        </select>

        <div class="time-output" id="current-date" aria-live="polite">
        Select a city to see its local time.
        </div>

        <div class="weather" aria-labelledby="weather-heading">
          <h2 id="weather-heading">Current Weather🌥️</h2>
          <div class="weather-reading">
            <span id="current-weather-icon" class="weather-icon" aria-hidden="true"></span>
            <p id="current-weather" aria-live="polite">Select a city to see its weather.</p>
          </div>
        </div>
      </main>

      <footer>
        This project was coded with ❤️ by Mel is open sourced on
        <a href="#" target="_blank">GitHub</a> and deployed on Netlify.
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
